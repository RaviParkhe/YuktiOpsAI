services:
  postgres:
    image: postgres:16-alpine
    container_name: yuktiops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yuktiops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yuktiops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-yuktiops}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yuktiops_user} -d ${POSTGRES_DB:-yuktiops}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yuktiops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
